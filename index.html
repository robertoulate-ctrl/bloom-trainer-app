<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Battles Pro Trainer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to enhance the theme */
        body {
            font-family: 'Inter', sans-serif;
        }
        .card {
            background-color: #1f2937;
            border: 1px solid #374151;
        }
        .btn-primary {
            background-color: #ca8a04; /* A warm coffee-like yellow/gold */
            color: #1f2937;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #eab308;
        }
        .btn-secondary {
            background-color: #4b5563;
            color: #e5e7eb;
            transition: background-color 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: #6b7280;
        }
        .input-field, .select-field {
            background-color: #374151;
            border: 1px solid #4b5563;
            color: #d1d5db;
        }
        .recipe-card {
            background-color: #111827;
            border: 1px solid #374151;
        }
        .recipe-title {
            color: #eab308;
        }
        .workflow-step {
            border-left: 2px solid #ca8a04;
            padding-left: 1rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-300">
    <!-- Main container -->
    <div class="w-full max-w-6xl mx-auto p-4 py-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Left Column: Inputs & Timer -->
        <div class="flex flex-col gap-8">
            <header class="text-center">
                <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">Bloom Battles</h1>
                <h2 class="text-2xl md:text-3xl font-semibold text-yellow-500">Pro Trainer</h2>
            </header>

            <div class="card p-6 rounded-lg shadow-lg">
                <h3 class="text-2xl font-bold text-white mb-6 border-b border-gray-700 pb-3">Parámetros de Competencia</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="method" class="block text-sm font-medium text-gray-400 mb-1">Método</label>
                        <!-- UPDATED: Official competition drippers -->
                        <select id="method" class="select-field w-full p-2 rounded-md focus:ring-2 focus:ring-yellow-500 focus:outline-none">
                            <option value="V60">V60 Plástico</option>
                            <option value="Origami">Origami Resina</option>
                            <option value="SOLO">SOLO Dripper</option>
                            <option value="UFO">UFO Acrílico</option>
                            <option value="April">April Brewer</option>
                            <option value="Graycano">Graycano</option>
                            <option value="Aeropress">Aeropress</option>
                        </select>
                    </div>
                    <div>
                        <label for="filterPaper" class="block text-sm font-medium text-gray-400 mb-1">Papel Filtro</label>
                        <select id="filterPaper" class="select-field w-full p-2 rounded-md focus:ring-2 focus:ring-yellow-500 focus:outline-none">
                            <option value="standard">Estándar (Hario/Kalita)</option>
                            <option value="fast">Rápido (Cafec Abaca+)</option>
                            <option value="ultrafast">Ultra-Rápido (Sibarist)</option>
                        </select>
                    </div>
                    <div>
                        <label for="process" class="block text-sm font-medium text-gray-400 mb-1">Proceso del Café</label>
                        <select id="process" class="select-field w-full p-2 rounded-md focus:ring-2 focus:ring-yellow-500 focus:outline-none">
                            <option value="Lavado">Lavado (Floral, Cítrico)</option>
                            <option value="Honey">Honey (Dulce, Frutos Rojos)</option>
                            <option value="Natural">Natural (Frutos maduros, Vinoso)</option>
                        </select>
                    </div>
                    <div>
                        <label for="grams" class="block text-sm font-medium text-gray-400 mb-1">Dosis (g)</label>
                        <input type="number" id="grams" value="15" min="10" max="30" class="input-field w-full p-2 rounded-md focus:ring-2 focus:ring-yellow-500 focus:outline-none">
                    </div>
                    <div class="sm:col-span-2">
                        <label for="ratio" class="block text-sm font-medium text-gray-400 mb-1">Ratio (1:X)</label>
                        <input type="number" id="ratio" value="16" min="10" max="20" class="input-field w-full p-2 rounded-md focus:ring-2 focus:ring-yellow-500 focus:outline-none">
                    </div>
                </div>
                <button id="generateBtn" class="btn-primary w-full mt-6 py-3 rounded-lg font-bold text-lg shadow-md">
                    Crear Estrategia Ganadora
                </button>
            </div>

            <section class="card p-6 rounded-lg shadow-lg">
                <h3 class="text-2xl font-bold text-white mb-4 border-b border-gray-700 pb-3 text-center">Cronómetro de Competencia</h3>
                <div class="text-center">
                    <div id="timerDisplay" class="text-7xl md:text-8xl font-mono text-yellow-400 my-4 transition-colors duration-300">00:00</div>
                    <div class="flex justify-center items-center space-x-4">
                        <button id="startStopBtn" class="btn-primary w-32 py-3 rounded-lg font-bold text-lg shadow-md">Iniciar</button>
                        <button id="resetBtn" class="btn-secondary w-32 py-3 rounded-lg font-bold text-lg shadow-md">Reiniciar</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Right Column: Strategy Output -->
        <div id="recipeOutput" class="recipe-card p-6 rounded-lg shadow-lg hidden">
            <h3 class="text-3xl font-bold text-white mb-4 border-b border-gray-700 pb-3">Receta Estratégica</h3>
            
            <div class="grid grid-cols-3 gap-4 mb-6 text-center">
                <div>
                    <h4 class="recipe-title font-semibold text-sm">AGUA TOTAL</h4>
                    <p id="totalWater" class="text-2xl font-bold text-white"></p>
                </div>
                <div>
                    <h4 class="recipe-title font-semibold text-sm">MOLIENDA (C40)</h4>
                    <p id="grindSetting" class="text-2xl font-bold text-white"></p>
                </div>
                <div>
                    <h4 class="recipe-title font-semibold text-sm">TEMP. AGUA</h4>
                    <p id="waterTemp" class="text-2xl font-bold text-white"></p>
                </div>
            </div>

            <div class="mb-6">
                <h4 class="text-xl font-bold text-yellow-500 mb-2">Filosofía de Extracción</h4>
                <p id="strategyNotes" class="text-sm italic text-gray-400"></p>
            </div>

            <div class="mb-6">
                <h4 class="text-xl font-bold text-yellow-500 mb-3">Estructura de Vertido Detallada</h4>
                <ul id="pourStructure" class="space-y-2"></ul>
            </div>

            <div>
                <h4 class="text-xl font-bold text-yellow-500 mb-3">Workflow de Competencia (8 Min)</h4>
                <div id="workflow" class="space-y-3"></div>
            </div>
        </div>

    </div>

    <script>
        // --- DOM Elements & Event Listeners ---
        const generateBtn = document.getElementById('generateBtn');
        const recipeOutput = document.getElementById('recipeOutput');
        const methodSelect = document.getElementById('method');
        const filterPaperSelect = document.getElementById('filterPaper');

        generateBtn.addEventListener('click', generateRecipe);
        
        methodSelect.addEventListener('change', () => {
            filterPaperSelect.disabled = methodSelect.value === 'Aeropress';
        });

        // --- Core Recipe Generation Logic ---
        function generateRecipe() {
            const method = methodSelect.value;
            const filterPaper = filterPaperSelect.value;
            const process = document.getElementById('process').value;
            const grams = parseFloat(document.getElementById('grams').value);
            const ratio = parseFloat(document.getElementById('ratio').value);

            if (method === 'Aeropress') {
                generateAeropressRecipe(process, grams);
                recipeOutput.classList.remove('hidden');
                return;
            }

            const totalWater = Math.round(grams * ratio);
            const grind = getGrindSetting(method, process, grams, ratio, filterPaper);
            const temp = getWaterTemperature(process, ratio, grams);
            const pours = getPourStructure(totalWater, grams, process, ratio, method);
            const notes = getStrategyNotes(process, ratio, grind.adjustmentReason);
            const workflowSteps = getWorkflow(temp, grind.value, pours.totalTime);

            // Display results
            document.getElementById('totalWater').textContent = `${totalWater}g`;
            document.getElementById('grindSetting').textContent = `${grind.value} clics`;
            document.getElementById('waterTemp').textContent = `${temp}°C`;
            document.getElementById('strategyNotes').textContent = notes;
            
            const pourList = document.getElementById('pourStructure');
            pourList.innerHTML = '';
            pours.steps.forEach(pour => {
                const li = document.createElement('li');
                li.innerHTML = pour;
                pourList.appendChild(li);
            });

            const workflowContainer = document.getElementById('workflow');
            workflowContainer.innerHTML = '';
            workflowSteps.forEach(step => {
                const div = document.createElement('div');
                div.className = 'workflow-step';
                div.innerHTML = `<p class="font-bold text-gray-300">${step.time}</p><p class="text-sm text-gray-400">${step.action}</p>`;
                workflowContainer.appendChild(div);
            });

            recipeOutput.classList.remove('hidden');
        }

        function generateAeropressRecipe(process, grams) {
             const temp = getWaterTemperature(process, 16, grams); // Use a standard ratio for temp calculation
             const grind = 18 + (process === 'Lavado' ? -2 : (process === 'Natural' ? 2 : 0));

            document.getElementById('totalWater').textContent = `~200g`;
            document.getElementById('grindSetting').textContent = `${grind} clics`;
            document.getElementById('waterTemp').textContent = `${temp}°C`;

            document.getElementById('strategyNotes').textContent = "Estrategia de máximo control: El Aeropress anula la rifa del ratio. Esta receta crea un concentrado y usa bypass para asegurar una taza limpia y balanceada, una táctica segura y consistente para ganar.";
            
            const pourList = document.getElementById('pourStructure');
            pourList.innerHTML = `
                <li><strong>Preparación:</strong> Usa el método invertido. Añade ${grams}g de café.</li>
                <li><strong>Inmersión (0:00 - 1:30):</strong> Vierte ${grams * 2.5}g de agua (~${temp}°C) en 15s. Agita suavemente por 10s. Deja en inmersión hasta 1:30.</li>
                <li><strong>Prensado (1:30 - 2:00):</strong> Presiona suavemente por 30s sobre la jarra.</li>
                <li><strong>Bypass:</strong> Añade agua caliente a la jarra (no al café) hasta alcanzar un total de 150ml en la taza de servicio.</li>
            `;

            const workflowContainer = document.getElementById('workflow');
            workflowContainer.innerHTML = getWorkflow(temp, grind, "2:00").map(step => `<div class="workflow-step"><p class="font-bold text-gray-300">${step.time}</p><p class="text-sm text-gray-400">${step.action}</p></div>`).join('');
        }
        
        // --- Enhanced Logic based on the Guide ---

        function getGrindSetting(method, process, grams, ratio, filterPaper) {
            // Base clicks from "Tabla 3" in the guide
            const baseClicks = { V60: 24, Origami: 26, SOLO: 25, UFO: 26, April: 28, Graycano: 25 };
            let adjustment = 0;
            let reasons = [];

            // Paper influences flow rate
            if (filterPaper === 'fast') { adjustment -= 2; reasons.push("papel rápido"); } 
            else if (filterPaper === 'ultrafast') { adjustment -= 4; reasons.push("papel ultra-rápido"); }

            // Process determines density and solubility
            if (process === 'Lavado') { adjustment -= 2; reasons.push("proceso lavado (denso)"); }
            if (process === 'Natural') { adjustment += 3; reasons.push("proceso natural (soluble)"); }
            
            // Dose affects bed depth
            if (grams <= 12) { adjustment -= 2; reasons.push("dosis baja (cama superficial)"); }
            if (grams >= 25) { adjustment += 3; reasons.push("dosis alta (cama profunda)"); }
            
            // Ratio is a powerful offensive/defensive tool
            if (ratio <= 14) { adjustment -= 2; reasons.push("ratio corto (riesgo de sub-extracción)"); }
            if (ratio >= 19) { adjustment += 3; reasons.push("ratio largo (riesgo de sobre-extracción)"); } // More aggressive adjustment for long ratios
            
            const finalClick = baseClicks[method] + adjustment;
            const adjustmentReason = "Ajuste de molienda basado en: " + reasons.join(', ') + ".";
            return { value: Math.max(10, finalClick), adjustmentReason: adjustmentReason }; // Prevent going too fine
        }

        function getWaterTemperature(process, ratio, grams) {
            let baseTemp = { Lavado: 96, Honey: 93, Natural: 90 };
            let temp = baseTemp[process];

            if (ratio >= 19) temp -= 3; // Aggressive temp drop for long ratios
            if (ratio <= 14) temp += 2; // Aggressive temp increase for short ratios
            if (grams >= 25) temp -= 1; 
            
            return Math.max(88, Math.min(98, temp)); // Keep temp within a winning range
        }

        function getStrategyNotes(process, ratio, adjustmentReason) {
            let baseNote = "";
            if (process === 'Lavado') {
                baseNote = "Priorizar claridad y acidez brillante. El objetivo es una extracción alta y uniforme para maximizar el dulzor sin defectos.";
            } else if (process === 'Honey') {
                baseNote = "Buscar el equilibrio perfecto entre dulzor, cuerpo y complejidad frutal. Evitar sabores fangosos.";
            } else { // Natural
                baseNote = "Controlar la intensidad. El objetivo es una taza jugosa y compleja, evitando la sobre-extracción que lleva a sabores fermentados o astringencia.";
            }
            if (ratio >= 19) { baseNote += " Con este ratio largo, el control de la sobre-extracción es CRÍTICO. Se recomienda usar la técnica de temperatura variable (bajar temp. en el último vertido)."; } 
            else if (ratio <= 14) { baseNote += " Con este ratio corto, el riesgo es la sub-extracción. La molienda fina y alta temperatura son claves para lograr una taza balanceada."; }
            return `${adjustmentReason} ${baseNote}`;
        }
        
        function getPourStructure(totalWater, grams, process, ratio, method) {
            let steps = [];
            const bloomWater = Math.round(Math.min(grams * 3, 60));
            let waterRemaining = totalWater - bloomWater;
            
            steps.push(`<strong>Bloom (0:00 - 0:45):</strong> Vierte ${bloomWater}g en 10s. Agita suavemente (swirl) para saturar uniformemente. Un burbujeo vigoroso indica un café muy fresco y mucho CO2.`);
            
            // Logic from the guide: more pulses for conicals, fewer for flat bottom
            const isConical = ['V60', 'Origami', 'SOLO', 'UFO', 'Graycano'].includes(method);
            let numPours = isConical ? 4 : 2; 
            if (ratio <= 14) numPours = 4;
            if (ratio >= 19) numPours = 2;

            const pourSize = Math.round(waterRemaining / numPours);
            let currentTime = 45;
            let accumulatedWater = bloomWater;

            for (let i = 1; i <= numPours; i++) {
                accumulatedWater += pourSize;
                const targetWater = Math.min(accumulatedWater, totalWater);
                steps.push(`<strong>Vertido ${i} (${formatTime(currentTime)}):</strong> Vierte ${pourSize}g en ~15s. Usa un flujo suave y circular desde baja altura para minimizar agitación y mantener el lecho de café plano.`);
                currentTime += 30;
            }

            let totalTime = "2:30 - 3:15";
            if (process === 'Natural' || ratio > 18) totalTime = "2:15 - 2:45";
            if (process === 'Lavado' && ratio < 14) totalTime = "3:00 - 3:45";
            
            steps.push(`<strong>Drawdown Final:</strong> Tras el último vertido, observa el drenaje. El objetivo es que la preparación termine alrededor de ${totalTime}. Retira el dripper cuando el flujo se convierta en un goteo lento para evitar amargor.`);
            return { steps, totalTime };
        }

        function getWorkflow(temp, grind, totalTime) {
            return [
                { time: "Fase 1: Análisis y Estrategia (0:00 - 1:30)", action: `Recibe las variables. Analiza el aroma del café en grano. Formula tu hipótesis (ej. 'Huele a fresa, parece un natural'). Basado en esto, define tus parámetros: <strong>Molienda ${grind} clics, Agua a ${temp}°C</strong>. Inicia la tetera y purga el filtro mientras anuncias tu plan.` },
                { time: "Fase 2: Ejecución y Adaptación (1:30 - 6:30)", action: `<strong>1:30-2:30:</strong> Muele el café. Realiza el bloom y observa la reacción para confirmar tu hipótesis. <br><strong>2:30-${totalTime.split(' - ')[0]}:</strong> Ejecuta los vertidos. <strong>Adapta en tiempo real:</strong> si el drenaje es muy rápido, vierte más lento; si es lento, agita suavemente (swirl). Explica tus decisiones a los jueces. <br><strong>${totalTime.split(' - ')[0]}-6:30:</strong> Durante el drawdown final, limpia tu estación meticulosamente y describe los sabores que esperas en la taza.` },
                { time: "Fase 3: Servicio y Conclusión (6:30 - 8:00)", action: `<strong>6:30-7:30:</strong> Retira el dripper. Homogeniza la bebida con un swirl final. Sirve con precisión 150ml. <br><strong>7:30-8:00:</strong> Presenta las tazas, resume el perfil de sabor y anuncia <strong>'¡Tiempo!'</strong> con confianza.` }
            ];
        }

        // --- Helper & Timer Functions ---
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${String(seconds).padStart(2, '0')}`;
        }
        
        const timerDisplay = document.getElementById('timerDisplay');
        const startStopBtn = document.getElementById('startStopBtn');
        const resetBtn = document.getElementById('resetBtn');
        let timerInterval = null, seconds = 0, isRunning = false;
        const MAX_SECONDS = 8 * 60;
        function updateTimerDisplay() {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
            if (seconds >= MAX_SECONDS - 30) { timerDisplay.classList.replace('text-yellow-400', 'text-red-500'); } 
            else { timerDisplay.classList.replace('text-red-500', 'text-yellow-400'); }
        }
        function startTimer() { if (isRunning) return; isRunning = true; startStopBtn.textContent = 'Detener'; startStopBtn.classList.replace('btn-primary', 'btn-secondary'); timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); if (seconds >= MAX_SECONDS) stopTimer(); }, 1000); }
        function stopTimer() { if (!isRunning) return; isRunning = false; startStopBtn.textContent = 'Iniciar'; startStopBtn.classList.replace('btn-secondary', 'btn-primary'); clearInterval(timerInterval); }
        function resetTimer() { stopTimer(); seconds = 0; updateTimerDisplay(); }
        startStopBtn.addEventListener('click', () => { if (isRunning) stopTimer(); else startTimer(); });
        resetBtn.addEventListener('click', resetTimer);

    </script>
</body>
</html>
